<!-- @dsCard height=300 -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi Botica</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:300px; width:960px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:300px; overflow:hidden; }
  .art svg { display:block; }
  .deep { fill:var(--brand-deep); }
  .brand { fill:var(--brand); }
  .care { fill:var(--care); }
  .soft { fill:var(--brand-soft); }
  .promo { fill:var(--promo); }
  .hl { fill:var(--highlight); }
  .x { fill:var(--brand); }
  .cut { fill:var(--on-care); }
  .blk { rx:var(--radius-lg); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:104px; line-height:.95; font-weight:800; letter-spacing:-.03em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 300" width="480" height="300">
<!--
  blocks      brand-deep 168x252 slab bled off the top (identity navy) · brand 96x120 · care 144x140 with a pharmacy cross cut out · promo 64x24 once (it only means "descuento") · brand-soft 120x128 tint · highlight 48x48 disc (campaign accent) — ~35% of 960x300
  arrangement one tall navy slab on the right with satellites stepping down-left, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     the pharmacy cross from "una botica de barrio": crosses at a space-6 pitch in brand over the brand-soft tint, one big cross cut into care
  scales      sides in space-4/space-6 multiples; gutters space-4; pitch space-6; corners radius-lg on blocks, radius-sm on crosses, pill rx = half side
-->
<rect class="soft blk" x="176" y="24" width="120" height="128" rx="20"/>
<rect class="x" x="194" y="32" width="4" height="16" rx="2"/><rect class="x" x="188" y="38" width="16" height="4" rx="2"/><rect class="x" x="218" y="56" width="4" height="16" rx="2"/><rect class="x" x="212" y="62" width="16" height="4" rx="2"/><rect class="x" x="242" y="32" width="4" height="16" rx="2"/><rect class="x" x="236" y="38" width="16" height="4" rx="2"/><rect class="x" x="266" y="56" width="4" height="16" rx="2"/><rect class="x" x="260" y="62" width="16" height="4" rx="2"/><rect class="x" x="194" y="80" width="4" height="16" rx="2"/><rect class="x" x="188" y="86" width="16" height="4" rx="2"/><rect class="x" x="242" y="80" width="4" height="16" rx="2"/><rect class="x" x="236" y="86" width="16" height="4" rx="2"/><rect class="x" x="218" y="104" width="4" height="16" rx="2"/><rect class="x" x="212" y="110" width="16" height="4" rx="2"/><rect class="x" x="266" y="104" width="4" height="16" rx="2"/><rect class="x" x="260" y="110" width="16" height="4" rx="2"/><rect class="x" x="194" y="128" width="4" height="16" rx="2"/><rect class="x" x="188" y="134" width="16" height="4" rx="2"/><rect class="x" x="242" y="128" width="4" height="16" rx="2"/><rect class="x" x="236" y="134" width="16" height="4" rx="2"/>
<rect class="brand blk" x="176" y="168" width="120" height="108" rx="20"/>
<rect class="care blk" x="64" y="136" width="96" height="140" rx="20"/>
<rect class="cut" x="100" y="170" width="24" height="72" rx="8"/><rect class="cut" x="76" y="194" width="72" height="24" rx="8"/>
<rect class="deep blk" x="312" y="-20" width="168" height="296" rx="20"/>
<rect class="promo" x="96" y="96" width="64" height="24" rx="12"/>
<circle class="hl" cx="384" cy="216" r="24"/>
</svg>
</div>
<div class="words">
<h1 class="name">Mi<br>Botica</h1>
<p class="tag">Cuidando a la familia del barrio, con precios claros.</p>
</div>
</div>
</body>
</html>
